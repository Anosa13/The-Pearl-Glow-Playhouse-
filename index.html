<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Premium 3D Project</title>
    <!-- Tailwind CSS for quick premium styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- GSAP for smooth animations -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <!-- Three.js for 3D graphics -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; overflow-x: hidden; }
        #canvas3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <canvas id="canvas3d"></canvas>

    <!-- Main Content Layout -->
    <main class="relative z-10 hidden" id="content">
        <!-- Hero Section -->
        <section class="h-screen flex flex-col justify-center items-center px-4 text-center">
            <h1 id="hero-title" class="text-5xl md:text-8xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 opacity-0 transform translate-y-10">
                Future Concept
            </h1>
            <p id="hero-sub" class="mt-6 text-gray-400 text-lg md:text-xl max-w-xl opacity-0">
                A high-end website built entirely for free using GitHub and open-source AI tools.
            </p>
        </section>

        <!-- Feature Section (For Scroll Interaction) -->
        <section class="h-screen flex flex-col justify-center items-center px-4 text-center bg-black/40 backdrop-blur-md">
            <h2 class="text-4xl md:text-6xl font-bold trigger-text">Interactive 3D Space</h2>
            <p class="mt-4 text-gray-400 max-w-md">Scroll down to watch the 3D particles morph and react to your movement.</p>
        </section>
    </main>

    <script>
        // --- 1. PRELOADER & GSAP INTRODUCTION ---
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('content').classList.remove('hidden');
            
            // Premium opening animation timeline
            const tl = gsap.timeline();
            tl.to("#hero-title", { opacity: 1, y: 0, duration: 1.5, ease: "power4.out" })
              .to("#hero-sub", { opacity: 1, duration: 1 }, "-=1");
        });

        // --- 2. THREE.JS 3D BACKGROUND ---
        const canvas = document.querySelector('#canvas3d');
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 3D Object: A Premium Glowing Particle Sphere
        const geometry = new THREE.BufferGeometry();
        const particlesCount = 800;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i=0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 5;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({
            size: 0.007,
            color: '#818cf8',
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mouse movement interaction
        let mouseX = 0;
        let mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // --- 3. ANIMATION LOOP & SCROLL TIE-IN ---
        const clock = new THREE.Clock();

        const animate = () => {
            const elapsedTime = clock.getElapsedTime();

            // Auto rotation
            particlesMesh.rotation.y = elapsedTime * 0.05;

            // Mouse tracking effect
            particlesMesh.rotation.x += (mouseY * 0.5 - particlesMesh.rotation.x) * 0.05;
            particlesMesh.rotation.y += (mouseX * 0.5 - particlesMesh.rotation.y) * 0.05;

            // Scroll reaction: Rotate faster based on page scroll window position
